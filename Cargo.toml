[package]
name = "crawler-engine"
version = "0.1.0"
edition = "2024"
description = "High-performance search engine with inverted index"
authors = ["Kyrylo Seriuk https://github.com/Kileer20100"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/OpenQueri/query-search"
keywords = ["search", "engine", "inverted-index", "information-retrieval"]
categories = ["algorithms", "database"]

[lib]
crate-type = ["cdylib", "rlib"]
rustflags = ["-C", "target-cpu=native"]


[dependencies]
tokio = { version = "1.51.1", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
scraper = "0.26.0"
regex = "1.12.3"
once_cell = "1.21.4"
futures = "0.3.32"
texting_robots = "0.2"
url = "2.5"
fxhash = "0.2.1"
async-recursion = "1.1.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = "1.0.149"
sled = "0.34"

[profile.release]
lto = "fat"        
codegen-units = 1     
panic = "abort"       
opt-level = 3
strip = true   